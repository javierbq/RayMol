name: PyMOLViewer
options:
  bundleIdPrefix: io.raymol
  deploymentTarget:
    macOS: "14.0"
    # 17.0 is forced: MPNNKit and mlx-swift both declare .iOS(.v17), and SPM
    # refuses to resolve below a dependency's floor. Design mode itself requires
    # iOS 18 at runtime (DesignAvailability) — the app does not.
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configFiles:
  Debug: PyMOLBridge.xcconfig
  Release: PyMOLBridge.xcconfig

packages:
  # MPNNKit: on-device ProteinMPNN inference. Linked on both platforms as of
  # Phase 2d; usage guarded by #if RAYMOL_MPNN + DesignAvailability (iOS 18+).
  proteinmpnn-mlx:
    url: https://github.com/javierbq/proteinmpnn-mlx.git
    from: 0.1.2
  # mlx-swift, linked DIRECTLY rather than only transitively through MPNNKit, so
  # MPNNRuntime can set the process-wide buffer-cache limit and the simulator CPU
  # fallback — neither is reachable through MPNNKit's API. `from:` not `exact:`:
  # MPNNKit pins mlx-swift exactly and that pin wins during resolution, so this
  # entry never needs bumping in lockstep.
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  # boltz-mlx: on-device Boltz-2 structure prediction (#224). macOS only -- MLX
  # cannot run in the iOS Simulator at all, and no boltz run above ~115 tokens has
  # ever completed on a physical device because iOS suspends the app mid-run.
  #
  # boltz-mlx pins mlx-swift exact 0.31.6, identical to MPNNKit's pin, so
  # resolution is unaffected and this entry never needs bumping in lockstep.
  BoltzMLX:
    url: https://github.com/javierbq/boltz-mlx.git
    # 0.2.0 adds the dense fp16/bfloat16 weight path: BoltzWeightStore selects it when
    # an artifact manifest declares no quantization block, which is what the
    # boltz2-bf16 predictor's pack does.
    #
    # 0.2.1 is a FLOOR, not a preference (#291): predictScored's `onProgress` only
    # exists from there, so BoltzJobManager does not compile against 0.2.0 and a
    # fresh resolve that landed on it would fail the build rather than degrade.
    from: 0.2.1
  # protenix-mlx: on-device Protenix (AlphaFold3-class) structure prediction (#309).
  # macOS only, for the same reasons boltz-mlx is: MLX cannot run in the iOS Simulator,
  # and Protenix is heavier than Boltz at equal length -- 3.9 GB peak at 400 residues.
  #
  # It featurizes in Swift, so unlike boltz-mlx it also carries a resource bundle (the
  # canonical-20 reference conformers, ~90 KB of JSON).
  #
  # Pins mlx-swift as a RANGE rather than exactly, so it composes with BoltzMLX's exact
  # 0.31.6 instead of deadlocking against it.
  ProtenixMLX:
    url: https://github.com/javierbq/protenix-mlx.git
    # 0.1.1 adds the progress/cancellation hook fold() needs to be driveable: without it
    # predict_cancel would do nothing for up to six minutes, and there is no fraction to
    # report. See FoldProgress.
    #
    # 0.1.2 fixes systematically compressed geometry -- the sampler was using struct
    # defaults (step_scale_eta 1.0, gamma0 0.0) instead of the pack's own 1.5 / 0.8, which
    # produced folds whose CA-CA distances averaged 3.27 A against an ideal 3.80. Anything
    # below it folds plausible-looking structures with bad local chemistry.
    #
    # 0.1.3 makes the protenix-v2 packs loadable at all: the confidence head hardcoded 4
    # triangle-attention heads, and v2's 256-wide pair track needs 8, so all three v2
    # packs died on load. Required for the v2 predictors registered here.
    from: 0.1.3
  # Sparkle auto-update framework. macOS-only — linked into the macOS slice of the
  # shared PyMOLViewer target via a platformFilter dependency; never the iOS slice.
  # RAYMOL_SPARKLE_BEGIN — stripped for the Mac App Store build by archive_appstore.sh
  # (MAS forbids self-update + Sparkle's helpers fail sandbox validation, error 90296).
  # The Developer-ID/DMG build keeps Sparkle for auto-update.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
# RAYMOL_SPARKLE_END

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_MODULES: YES
    SWIFT_OBJC_BRIDGING_HEADER: PyMOLViewer/Bridge/PyMOLBridge.h
    # Do NOT add PyMOL layer paths to HEADER_SEARCH_PATHS —
    # layer0/Block.h shadows the system Block.h and breaks module builds.
    # All paths/flags (incl. per-SDK LIBRARY_SEARCH_PATHS) live in
    # PyMOLBridge.xcconfig. macOS links build_macos_swiftui + the embedded
    # standalone Python 3.13 (no Homebrew/python@3.14). Do NOT set
    # LIBRARY_SEARCH_PATHS here — a target-level value would override the
    # xcconfig's per-SDK paths.

schemes:
  # Standalone macOS unit-test scheme so `xcodebuild test -scheme UnitTests_macOS`
  # only builds + runs PyMOLViewerTests (macOS) and never touches the iOS targets.
  # DesignInferenceSmokeTests skips automatically here (no MPNN_INFERENCE env var).
  UnitTests_macOS:
    build:
      targets:
        PyMOLViewer_macOS: [test, build]
        PyMOLViewerTests: [test, build]
    test:
      targets:
        - PyMOLViewerTests
      gatherCoverageData: false

  # Inference-enabled variant: the tests that run REAL on-host MLX inference, which
  # every other scheme skips so the fast suite never blocks on weight loading. The
  # gates have to live here rather than in the shell environment — a unit-test bundle
  # hosted in the app reads the environment xcodebuild builds from the SCHEME, so
  # `FOO=1 xcodebuild test` never reaches the test process.
  #
  #   MPNN_INFERENCE            DesignInferenceSmokeTests (24 MB weights, ~30–120 s)
  #   RAYMOL_PREDICT_MSA_SWEEP  PredictMSAMemorySweepTests (505 MB weights, TENS OF
  #                             MINUTES — it is a measurement, not a check)
  #
  # Always pair with -only-testing: running the whole bundle under this scheme starts
  # the sweep by accident.
  UnitTests_macOS_Inference:
    build:
      targets:
        PyMOLViewer_macOS: [test, build]
        PyMOLViewerTests: [test, build]
    test:
      targets:
        - PyMOLViewerTests
      gatherCoverageData: false
      environmentVariables:
        - variable: MPNN_INFERENCE
          value: "1"
          isEnabled: true
        - variable: RAYMOL_PREDICT_MSA_SWEEP
          value: "1"
          isEnabled: true

targets:
  PyMOLViewer:
    type: application
    platform: [macOS, iOS]
    sources:
      - path: PyMOLViewer
        excludes:
          - "**/*.md"
    settings:
      base:
        # Design mode: RAYMOL_MPNN enables MPNNKit (ProteinMPNN inference) on both
        # platforms as of Phase 2d. Kept as two per-SDK keys rather than one
        # unconditional setting so either slice can be turned off independently
        # without disturbing the other. Availability on iOS is additionally gated at
        # RUNTIME to iOS 18+ by DesignAvailability — see the Phase 2d spec §4.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=macosx*]": "$(inherited) RAYMOL_MPNN"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]": "$(inherited) RAYMOL_MPNN"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator*]": "$(inherited) RAYMOL_MPNN"
        # Apple-silicon only: the embedded standalone Python 3.13, libpymol_core.a,
        # and Homebrew deps are all arm64-only, so Release/Archive (which would
        # otherwise build "Any Mac" incl. x86_64) must be pinned to arm64 or the
        # link fails with undefined symbols. iOS device/sim on Apple Silicon are
        # arm64 too. (Debug worked only because it builds the active arch.)
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        PRODUCT_NAME: RayMol
        PRODUCT_BUNDLE_IDENTIFIER: io.raymol.RayMol
        # App icon: the Icon Composer bundle PyMOLViewer/Resources/RayMol.icon
        # (added in PR #124). This MUST live in project.yml, not just the
        # generated project.pbxproj — make_dmg.sh re-runs `xcodegen generate`
        # at release time, so without it here the release reverts to the
        # AppIcon.appiconset fallback. Applies to both macOS + iOS.
        ASSETCATALOG_COMPILER_APPICON_NAME: RayMol
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.9.1"
        CURRENT_PROJECT_VERSION: 26
        # Human-readable beta label, e.g. "1.9.1-beta27". EMPTY on purpose in the
        # committed file: empty means "this is not a beta", and the postBuildScript
        # below then leaves RayMolBetaLabel out of the Info.plist entirely. Only
        # ci_post_clone.sh fills it in, in the ephemeral Xcode Cloud checkout, via
        # apply_ci_versions.sh's 4th argument. Never commit a non-empty value —
        # every DMG and App Store build would then claim to be a beta.
        # Apple only ever sees MARKETING_VERSION + CURRENT_PROJECT_VERSION;
        # CFBundleShortVersionString may not carry a "-betaN" suffix.
        RAYMOL_BETA_LABEL: ""
        GENERATE_INFOPLIST_FILE: YES
        # Generate a launch screen so iOS renders at the device's NATIVE
        # resolution. Without it the app is letterboxed at a legacy size on
        # physical devices (the Simulator is more lenient).
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # User-facing app brand. PRODUCT_NAME = RayMol → the bundle is RayMol.app
        # and CFBundleName derives from it. CFBundleDisplayName (iOS home-screen
        # name) is set here; the post-build step below still force-sets
        # CFBundleName = RayMol since the generated plist can lag PRODUCT_NAME.
        INFOPLIST_KEY_CFBundleDisplayName: RayMol
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # Export compliance: only standard HTTPS/TLS → exempt, no extra paperwork.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # iOS orientations: portrait + both landscapes, no upside-down (a
        # molecular viewer flipped 180° is disorienting and serves no purpose).
        # Applied to iPhone and iPad; ignored on the macOS slice of this target.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad must declare ALL FOUR orientations (incl. PortraitUpsideDown) or
        # App Store upload rejects it for iPad multitasking (error 90474).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          DEBUG_INFORMATION_FORMAT: dwarf
          # iOS Debug needs the entitlements file too. Debug otherwise carries none (the
          # key below is under Release), and a Debug build is exactly what gets installed
          # on a phone over cable to measure prediction memory — measuring against a
          # jetsam ceiling the shipping build will not have would make every number
          # collected here a lie in the pessimistic direction. macOS Debug is left alone:
          # adding the sandbox to an unsigned local build breaks it.
          #
          # Commented out for the same reason as the Release pair below — see there for
          # the portal step that has to happen first. Uncomment BOTH pairs together, or
          # measurements from a Debug device build will not reflect the shipping ceiling.
          # "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": PyMOLViewer/RayMolIOS.entitlements
          # "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": PyMOLViewer/RayMolIOS.entitlements
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          # App Store distribution: automatic Distribution signing + App Sandbox
          # + Hardened Runtime + entitlements (created in Task 2). Both platforms.
          DEVELOPMENT_TEAM: VT99UQUQ89
          CODE_SIGN_STYLE: Automatic
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_APP_SANDBOX: YES
          CODE_SIGN_ENTITLEMENTS: PyMOLViewer/RayMol.entitlements
          # OPT-IN, not enabled: PyMOLViewer/RayMolIOS.entitlements requests the
          # Increased Memory Limit entitlement, which roughly doubles what an on-device
          # fold can be — see PredictSizeGuard, where an unentitled iPhone 15 Pro budget
          # refuses past ~120 residues. It is commented out because it does NOT build
          # without a portal change first: automatic signing fails with "Provisioning
          # profile ... doesn't include the Increased Memory Limit capability".
          #
          # To turn it on: enable "Increased Memory Limit" for the io.raymol.RayMol App ID
          # at developer.apple.com (Certificates, Identifiers & Profiles → Identifiers),
          # let Xcode regenerate the profile, then uncomment both lines here AND the pair
          # under Debug above. Nothing in the Swift code changes — the entitlement only
          # moves the number os_proc_available_memory() reports, and the guard keeps
          # refusing whatever does not fit whatever budget is actually granted.
          # "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": PyMOLViewer/RayMolIOS.entitlements
          # "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": PyMOLViewer/RayMolIOS.entitlements
          # iOS App Store guideline-2.5.2 fallback: if the iOS app is rejected
          # for the command line / Raymond, uncomment the next line to compile
          # them out of the iOS build (no effect on macOS — the flag is gated to
          # os(iOS) in RayMolBuild), then re-archive + resubmit GUI-only.
          # SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) RAYMOL_IOS_APPSTORE_RESTRICTED
          # Mac App Store fallback: uncomment to compile the MCP server + bridge
          # OUT of the macOS build (sandbox + 2.5.2). No effect on iOS — gated to
          # os(macOS) in RayMolBuild.mcpEnabled. Then archive for the MAS.
          # SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) RAYMOL_MAS_RESTRICTED
    # iOS runtime packaging (BeeWare CPython 3.13). Guarded to iOS via
    # PLATFORM_NAME so the macOS target is unaffected. The xcframework has no
    # macOS slice, so a native embed dependency can't be used on a shared target.
    postBuildScripts:
      # User-facing app brand: force CFBundleName = RayMol. PRODUCT_NAME is now
      # RayMol so the bundle is RayMol.app, but the generated Info.plist can lag
      # PRODUCT_NAME for CFBundleName (no INFOPLIST_KEY_* for it), so set it
      # directly on the built plist. Runs on BOTH platforms (macOS title bar /
      # app menu + iOS).
      - name: "Brand: set CFBundleName = RayMol"
        basedOnDependencyAnalysis: false
        # Declare the generated Info.plist as an input so Xcode's build graph
        # schedules this script AFTER Info.plist processing. Without this edge the
        # script races plist generation and its plutil edits can be silently
        # overwritten (this is what dropped the Sparkle keys from a 1.3.2 build).
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "$PLIST" ] || { echo "no Info.plist at $PLIST"; exit 0; }
          /usr/bin/plutil -replace CFBundleName -string "RayMol" "$PLIST"
          echo "CFBundleName -> RayMol ($PLIST)"
      # Beta label for testers, e.g. "1.9.1-beta27" -> Info.plist RayMolBetaLabel,
      # which AppBuildInfo reads and the Settings pane shows under the version.
      # Apple's own CFBundleShortVersionString cannot carry the "-betaN" suffix
      # (at most three numeric components), so this is the only place testers can
      # see which beta they are on. Runs on BOTH platforms; a no-op unless
      # ci_post_clone.sh stamped RAYMOL_BETA_LABEL for this build.
      - name: "Beta: set RayMolBetaLabel from RAYMOL_BETA_LABEL"
        basedOnDependencyAnalysis: false
        # Same Info.plist input edge as above — without it this races plist
        # generation and the key is silently dropped.
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          set -e
          LABEL="${RAYMOL_BETA_LABEL:-}"
          # Empty is the normal case: every local, DMG and App Store build. Leave
          # the key ABSENT rather than writing "" so the app can treat presence of
          # the key as "this is a beta" without also testing for emptiness.
          [ -n "$LABEL" ] || { echo "RayMolBetaLabel skipped (not a beta build)"; exit 0; }
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "$PLIST" ] || { echo "no Info.plist at $PLIST"; exit 0; }
          /usr/bin/plutil -replace RayMolBetaLabel -string "$LABEL" "$PLIST"
          echo "RayMolBetaLabel -> $LABEL ($PLIST)"
      # Sparkle auto-update keys. macOS only (Sparkle is not linked on iOS), and
      # skipped for the Mac App Store fallback (RAYMOL_MAS_RESTRICTED) since that
      # build updates through Apple. The public EdDSA key pairs with the private
      # key in the developer's login keychain (used by swiftui/publish_release.sh).
      - name: "Sparkle: inject auto-update Info.plist keys (macOS, non-MAS)"
        basedOnDependencyAnalysis: false
        # Input dependency on the generated Info.plist forces this to run AFTER
        # plist processing (see note above). make_dmg.sh ALSO re-asserts these
        # keys before signing as a release-time guarantee; this fixes dev builds.
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          set -e
          case "${PLATFORM_NAME:-}" in macosx) ;; *) echo "Sparkle keys skipped ($PLATFORM_NAME)"; exit 0 ;; esac
          case "${SWIFT_ACTIVE_COMPILATION_CONDITIONS:-}" in *RAYMOL_MAS_RESTRICTED*) echo "Sparkle keys skipped (MAS build)"; exit 0 ;; esac
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "$PLIST" ] || { echo "no Info.plist at $PLIST"; exit 0; }
          /usr/bin/plutil -replace SUFeedURL -string "https://github.com/javierbq/RayMol/releases/latest/download/appcast.xml" "$PLIST"
          /usr/bin/plutil -replace SUPublicEDKey -string "V+5+HSmGNq4JQXW6tDbODBtV3z0Sn/nk/qFyycc2Blg=" "$PLIST"
          /usr/bin/plutil -replace SUEnableAutomaticChecks -bool true "$PLIST"
          /usr/bin/plutil -replace SUScheduledCheckInterval -integer 86400 "$PLIST"
          echo "Sparkle keys -> $PLIST"
      # Register RayMol as a handler/default for molecular file formats. The
      # generated Info.plist (GENERATE_INFOPLIST_FILE=YES) has no INFOPLIST_KEY_*
      # for the complex CFBundleDocumentTypes / UTImportedTypeDeclarations arrays,
      # so inject them directly on the built plist (both macOS + iOS). RayMol owns
      # .pse (LSHandlerRank=Owner); the structure/small-molecule/map families are
      # declared as imported UTIs (conforming to public.data, plus public.text for
      # the text-based ones) so RayMol becomes a first-class handler and the
      # default where nothing else claims the type. macOS registration happens via
      # lsregister; iOS surfaces these in Files / Open-in.
      - name: "Brand: register molecular document types"
        basedOnDependencyAnalysis: false
        # Input dependency on the generated Info.plist forces this to run AFTER
        # plist processing (see note above) — same race that dropped these arrays.
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "$PLIST" ] || { echo "no Info.plist at $PLIST"; exit 0; }
          /usr/bin/plutil -replace CFBundleDocumentTypes -json '[
            {"CFBundleTypeName":"PyMOL Session","CFBundleTypeRole":"Editor","LSHandlerRank":"Owner","LSItemContentTypes":["org.pymol.pse"]},
            {"CFBundleTypeName":"Molecular Structure","CFBundleTypeRole":"Viewer","LSHandlerRank":"Default","LSItemContentTypes":["org.pymol.structure"]},
            {"CFBundleTypeName":"Small Molecule","CFBundleTypeRole":"Viewer","LSHandlerRank":"Default","LSItemContentTypes":["org.pymol.small-molecule"]},
            {"CFBundleTypeName":"Electron Density / Map","CFBundleTypeRole":"Viewer","LSHandlerRank":"Default","LSItemContentTypes":["org.pymol.map"]}
          ]' "$PLIST"
          /usr/bin/plutil -replace UTImportedTypeDeclarations -json '[
            {"UTTypeIdentifier":"org.pymol.pse","UTTypeDescription":"PyMOL Session","UTTypeConformsTo":["public.data"],"UTTypeTagSpecification":{"public.filename-extension":["pse"]}},
            {"UTTypeIdentifier":"org.pymol.structure","UTTypeDescription":"Molecular Structure","UTTypeConformsTo":["public.data","public.text"],"UTTypeTagSpecification":{"public.filename-extension":["pdb","ent","cif","mmcif","mcif","mmtf"]}},
            {"UTTypeIdentifier":"org.pymol.small-molecule","UTTypeDescription":"Small Molecule","UTTypeConformsTo":["public.data","public.text"],"UTTypeTagSpecification":{"public.filename-extension":["sdf","mol","mol2","xyz","mae"]}},
            {"UTTypeIdentifier":"org.pymol.map","UTTypeDescription":"Electron Density / Map","UTTypeConformsTo":["public.data"],"UTTypeTagSpecification":{"public.filename-extension":["ccp4","mtz","dx","xplor","map","mrc"]}}
          ]' "$PLIST"
          # A document-based app declaring CFBundleDocumentTypes must also state
          # whether it opens files in place (App Store warning 90737). RayMol opens
          # documents in place (Files / drag-drop), so declare it.
          /usr/bin/plutil -replace LSSupportsOpeningDocumentsInPlace -bool YES "$PLIST"
          echo "CFBundleDocumentTypes + UTImportedTypeDeclarations -> $PLIST"
      - name: "iOS: Embed Python.framework"
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in iphone*) ;; *) echo "skip (non-iOS)"; exit 0 ;; esac
          set -e
          if [ "$EFFECTIVE_PLATFORM_NAME" = "-iphonesimulator" ]; then SLICE=ios-arm64_x86_64-simulator; else SLICE=ios-arm64; fi
          SRC="$SRCROOT/../deps_ios/Python.xcframework/$SLICE/Python.framework"
          mkdir -p "$CODESIGNING_FOLDER_PATH/Frameworks"
          ditto "$SRC" "$CODESIGNING_FOLDER_PATH/Frameworks/Python.framework"
      - name: "iOS: Install Python stdlib"
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in iphone*) ;; *) exit 0 ;; esac
          set -e
          if [ "$EFFECTIVE_PLATFORM_NAME" = "-iphonesimulator" ]; then SLICE=ios-arm64_x86_64-simulator; else SLICE=ios-arm64; fi
          mkdir -p "$CODESIGNING_FOLDER_PATH/python/lib"
          rsync -au --delete "$SRCROOT/../deps_ios/Python.xcframework/$SLICE/lib/" "$CODESIGNING_FOLDER_PATH/python/lib/"
          # App Review compliance (mirrors the macOS prune; mostly defensive on iOS
          # since BeeWare ships no Tk binaries and its stdlib already omits the
          # itms-services token):
          #  (2.5.1) Drop any Tcl/Tk binaries + the dead pure-Python tkinter package
          #  so the bundle carries zero Tk references. The native Metal/SwiftUI app
          #  never launches the legacy pmg_tk Tkinter GUI.
          PYLIB="$CODESIGNING_FOLDER_PATH/python/lib"
          rm -rf "$PYLIB"/libtcl*.dylib "$PYLIB"/libtk*.dylib \
                 "$PYLIB"/tcl* "$PYLIB"/tk* "$PYLIB"/itcl* "$PYLIB"/thread* \
                 "$PYLIB"/python*/tkinter
          rm -f  "$PYLIB"/python*/lib-dynload/_tkinter*.so
          #  (2.5.2) Strip 'itms-services' from urllib/parse.py's uses_netloc. No-op
          #  on the current BeeWare build, but guarantees parity if a future stdlib
          #  bump reintroduces the literal Apple's static scanner flags.
          /usr/bin/sed -i '' "s/, 'itms-services'//g" "$PYLIB"/python*/urllib/parse.py
      - name: "iOS: Prepare Python binary modules"
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in iphone*) ;; *) exit 0 ;; esac
          set -e
          TEMPLATE="$SRCROOT/PyMOLViewer/Resources/dylib-Info-template.plist"
          OSSL_PRIVACY="$SRCROOT/PyMOLViewer/Resources/openssl-PrivacyInfo.xcprivacy"
          install_dylib () {
            INSTALL_BASE=$1; FULL_EXT=$2
            RELATIVE_EXT=${FULL_EXT#$CODESIGNING_FOLDER_PATH/}
            PYTHON_EXT=${RELATIVE_EXT/$INSTALL_BASE/}
            FULL_MODULE_NAME=$(echo $PYTHON_EXT | cut -d "." -f 1 | tr "/" ".")
            # tr maps '_'→'-' (underscores are illegal in bundle IDs); the sed then
            # strips any leading dashes a segment picked up (e.g. Python C-ext
            # modules like `_pcg64` or `numpy._core` → `.-pcg64` / `.-core`), which
            # Apple rejects as invalid bundle identifiers. Folder/executable names
            # (FULL_MODULE_NAME) keep their underscores — only the ID is sanitized.
            FRAMEWORK_BUNDLE_ID=$(echo $PRODUCT_BUNDLE_IDENTIFIER.$FULL_MODULE_NAME | tr "_" "-" | sed -E 's/\.-+/./g')
            FRAMEWORK_FOLDER="Frameworks/$FULL_MODULE_NAME.framework"
            if [ ! -d "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER" ]; then
              mkdir -p "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER"
              cp "$TEMPLATE" "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER/Info.plist"
              plutil -replace CFBundleExecutable -string "$FULL_MODULE_NAME" "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER/Info.plist"
              plutil -replace CFBundleIdentifier -string "$FRAMEWORK_BUNDLE_ID" "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER/Info.plist"
              # Each embedded framework's declared MinimumOSVersion must be one its
              # binary can actually run on. The template ships a low floor (12.0),
              # but the module .so's are built for the app's deployment target (or
              # 16.0 for numpy) — a lower declared value trips ITMS-90208 ("does not
              # support the minimum OS Version"). Pin it to the app's deployment
              # target; every embedded binary supports that.
              plutil -replace MinimumOSVersion -string "${IPHONEOS_DEPLOYMENT_TARGET:-16.0}" "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER/Info.plist"
            fi
            # _ssl and _hashlib statically link OpenSSL/BoringSSL, which Apple's
            # "commonly used third-party SDK" list requires to carry a privacy
            # manifest (ITMS-91061). Drop one into those two frameworks; it gets
            # signed with the framework in the codesign pass below.
            # Deliberately OUTSIDE the `! -d` guard above: that guard only fires
            # when the framework folder is created, so on an incremental build
            # over build products predating this fix the manifest would never be
            # copied and the app would ship without it. Copying every time is
            # idempotent and cheap.
            case "$FULL_MODULE_NAME" in
              _ssl|_hashlib) cp "$OSSL_PRIVACY" "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER/PrivacyInfo.xcprivacy" ;;
            esac
            mv "$FULL_EXT" "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER/$FULL_MODULE_NAME"
            echo "$FRAMEWORK_FOLDER/$FULL_MODULE_NAME" > "${FULL_EXT%.so}.fwork"
            echo "${RELATIVE_EXT%.so}.fwork" > "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER/$FULL_MODULE_NAME.origin"
          }
          PYTHON_VER=$(ls -1 "$CODESIGNING_FOLDER_PATH/python/lib")

          # Cross-compiled numpy (best-effort): copy the SDK-correct slice into
          # site-packages, then framework-wrap each numpy .so exactly like the
          # stdlib lib-dynload modules above (iOS forbids dlopen of loose .so in
          # the bundle; the .fwork redirect points the import at the framework).
          # numpy ships no iOS wheels — these slices are built by
          # scripts/build_numpy_ios.sh (meson cross-compile, no external BLAS).
          # Guarded: if the slice is absent the app still builds + runs WITHOUT
          # numpy (Task 1 / on-device Vertex minting does not depend on it).
          if [ "$EFFECTIVE_PLATFORM_NAME" = "-iphonesimulator" ]; then NP_SLICE=simulator; else NP_SLICE=device; fi
          NP_SRC="$SRCROOT/../deps_ios/numpy-ios/$NP_SLICE/numpy"
          if [ -d "$NP_SRC" ]; then
            SP="$CODESIGNING_FOLDER_PATH/python/lib/$PYTHON_VER/site-packages"
            mkdir -p "$SP"
            rsync -a --delete "$NP_SRC/" "$SP/numpy/"
            find "$SP/numpy" -name "*.so" | while read FULL_EXT; do
              install_dylib "python/lib/$PYTHON_VER/site-packages/" "$FULL_EXT"
            done
            echo "numpy ($NP_SLICE) bundled + framework-wrapped"
          else
            echo "numpy slice $NP_SLICE not found ($NP_SRC) — app builds without numpy"
          fi

          find "$CODESIGNING_FOLDER_PATH/python/lib/$PYTHON_VER/lib-dynload" -name "*.so" | while read FULL_EXT; do
            install_dylib "python/lib/$PYTHON_VER/lib-dynload/" "$FULL_EXT"
          done

          # Fail the build rather than ship a binary App Review will reject.
          # iOS 1.8.1 (build 24) was cut from the v1.8.0 tag, which predates the
          # privacy-manifest fix by 15 minutes — the manifests were silently
          # absent and Apple returned ITMS-91061, leaving the version stuck in
          # "Invalid Binary". A missing manifest must break the build loudly.
          for OSSL_MOD in _ssl _hashlib; do
            OSSL_FW="$CODESIGNING_FOLDER_PATH/Frameworks/$OSSL_MOD.framework"
            if [ -d "$OSSL_FW" ] && [ ! -f "$OSSL_FW/PrivacyInfo.xcprivacy" ]; then
              echo "error: $OSSL_MOD.framework is missing PrivacyInfo.xcprivacy — App Review rejects this with ITMS-91061 (OpenSSL/BoringSSL is a 'commonly used third-party SDK'). Expected source: $OSSL_PRIVACY" >&2
              exit 1
            fi
          done

          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            find "$CODESIGNING_FOLDER_PATH/Frameworks" -name "*.framework" -exec /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" ${OTHER_CODE_SIGN_FLAGS:-} -o runtime --timestamp=none --preserve-metadata=identifier,entitlements,flags "{}" \; || true
          fi
      - name: "iOS: Bundle PyMOL modules + data"
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in iphone*) ;; *) exit 0 ;; esac
          set -e
          ditto "$SRCROOT/../modules" "$CODESIGNING_FOLDER_PATH/modules"
          # pmg_tk/pmg_qt are the classic Tk/Qt desktop GUIs — dead weight here,
          # the native Metal/SwiftUI app never imports either.
          rm -rf "$CODESIGNING_FOLDER_PATH/modules/pmg_tk" "$CODESIGNING_FOLDER_PATH/modules/pmg_qt"
          ditto "$SRCROOT/../data" "$CODESIGNING_FOLDER_PATH/data"
      # macOS runtime packaging: payload under Contents/Resources (so the shared
      # bridge's config.home=<resourcePath>/python resolves to it). Guarded to
      # macOS so the iOS build is unaffected.
      - name: "macOS: Bundle Python + modules + data"
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in macosx*) ;; *) exit 0 ;; esac
          set -e
          RES="$CODESIGNING_FOLDER_PATH/Contents/Resources"
          mkdir -p "$RES"
          rsync -au --delete "$SRCROOT/../deps_macos/python-standalone/python/" "$RES/python/"
          # App Review compliance — prune from the embedded Python before signing:
          #  (2.5.1) The bundled Tcl/Tk's libtcl9tk9.0.dylib references the private
          #  AppKit symbol _NSWindowDidOrderOnScreenNotification. The native
          #  Metal/SwiftUI app never launches the legacy pmg_tk Tkinter GUI, so the
          #  whole Tcl/Tk stack is dead weight. Remove it.
          PYLIB="$RES/python/lib"
          rm -rf "$PYLIB"/libtcl*.dylib "$PYLIB"/libtk*.dylib \
                 "$PYLIB"/tcl* "$PYLIB"/tk* "$PYLIB"/itcl* "$PYLIB"/thread* \
                 "$PYLIB"/python*/tkinter
          rm -f  "$PYLIB"/python*/lib-dynload/_tkinter*.so
          #  (2.5.2) CPython's stdlib urllib/parse.py lists 'itms-services' in
          #  uses_netloc; Apple's static scanner reads that literal as the app
          #  installing executable code via itms-services://. RayMol never uses the
          #  scheme — strip the token (no functional effect on URL parsing we do).
          /usr/bin/sed -i '' "s/, 'itms-services'//g" "$PYLIB"/python*/urllib/parse.py
          ditto "$SRCROOT/../modules" "$RES/modules"
          # pmg_tk/pmg_qt are the classic Tk/Qt desktop GUIs — dead weight here,
          # the native Metal/SwiftUI app never imports either.
          rm -rf "$RES/modules/pmg_tk" "$RES/modules/pmg_qt"
          # Mac App Store build: drop the MCP server package (compiled out of the app).
          case "${SWIFT_ACTIVE_COMPILATION_CONDITIONS:-}" in *RAYMOL_MAS_RESTRICTED*) rm -rf "$RES/modules/raymol_mcp" ;; esac
          ditto "$SRCROOT/../data" "$RES/data"
          # Mac App Store code-signing of the embedded Python. python-standalone
          # ships its own signatures (foreign team, no app-sandbox), and Xcode's
          # final signing doesn't re-sign files under Resources/. So re-sign every
          # embedded Mach-O with OUR identity + hardened runtime here (before the
          # bundle is sealed): nested EXECUTABLES (bin/) get the app-sandbox +
          # inherit entitlement (Apple requires every nested executable to carry
          # app-sandbox — error 90296); libraries (.dylib/.so) get our signature
          # without entitlements. Runs only when signing (skipped for unsigned CLI).
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            ENT="$SRCROOT/PyMOLViewer/RayMolPython.entitlements"
            # Executables under the embedded python's bin/.
            find "$RES/python/bin" -type f 2>/dev/null | while read -r f; do
              /usr/bin/file "$f" | /usr/bin/grep -q "Mach-O.*executable" && \
                /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
                  -o runtime --timestamp=none --entitlements "$ENT" "$f" || true
            done
            # All embedded libraries / extension modules.
            find "$RES/python" \( -name "*.dylib" -o -name "*.so" \) -type f | while read -r f; do
              /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
                -o runtime --timestamp=none "$f" || true
            done
          fi
      # macOS portability: freetype/libpng are linked out of Homebrew (-lfreetype
      # -lpng16 from /opt/homebrew/lib in PyMOLBridge.xcconfig), so the linker
      # bakes /opt/homebrew/.../libfreetype.6.dylib into the binary as a hard load
      # command. On any Mac without those exact Homebrew kegs (every end user, a
      # clean VM, the App Store sandbox) dyld can't find them and aborts at launch
      # ("Library not loaded ... Namespace DYLD ... Library missing"). This step
      # copies those dylibs into Contents/Frameworks and rewrites the load
      # commands + ids to @rpath, adding @executable_path/../Frameworks to the
      # binary's runpath, so the app is self-contained. Idempotent: a second run
      # finds nothing to rewrite. The script signs only the copied dylibs (when
      # signing); the main binary is sealed by Xcode's final CodeSign / make_dmg.
      - name: "macOS: Bundle Homebrew dylibs into Frameworks (@rpath)"
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in macosx*) ;; *) exit 0 ;; esac
          set -e
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/python3 "$SRCROOT/../scripts/bundle_macos_dylibs.py" \
              "$CODESIGNING_FOLDER_PATH" \
              --sign-identity "$EXPANDED_CODE_SIGN_IDENTITY" --hardened
          else
            /usr/bin/python3 "$SRCROOT/../scripts/bundle_macos_dylibs.py" \
              "$CODESIGNING_FOLDER_PATH"
          fi
      # Copy the MPNN weight pack into the built app as a real directory (folder
      # reference) so Bundle.main.url(forResource:withExtension:) resolves the whole
      # directory as a single URL (MPNNGate.packURL). Lives in swiftui/resources_mpnn/
      # (outside the auto-scanned PyMOLViewer/ tree) so xcodegen never adds it to a
      # Copy Bundle Resources phase — it must be copied exactly once, here.
      # UNLOCALIZED_RESOURCES_FOLDER_PATH resolves to Contents/Resources on macOS and
      # to the flat app root on iOS, which is where MPNNGate.packURL looks on each.
      - name: "Bundle MPNN.mpnnpack"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST"
          rm -rf "$DEST/MPNN.mpnnpack"
          cp -R "${SRCROOT}/resources_mpnn/MPNN.mpnnpack" "$DEST/MPNN.mpnnpack"
    dependencies:
      # MPNNKit: on-device ProteinMPNN inference. Linked on BOTH platforms as of
      # Phase 2d. All usage is guarded by #if RAYMOL_MPNN, and iOS availability is
      # gated at runtime to iOS 18+ by DesignAvailability.
      # NOTE: this entry must stay OUTSIDE the RAYMOL_SPARKLE_BEGIN/END markers
      # below, or archive_appstore.sh's sed-strip removes it from the MAS build.
      - package: proteinmpnn-mlx
        product: MPNNKit
      - package: mlx-swift
        product: MLX
      # boltz-mlx: structure prediction. Linked on BOTH platforms — the iOS slice
      # was added for on-device folding on a physical iPhone. No compilation
      # condition and no platform filter: prediction ships in every build, so there
      # is no flag to forget, and the Swift side is gated by `#if os(macOS) ||
      # os(iOS)` plus the RUNTIME gate in PredictAvailability (which is what keeps
      # the iOS Simulator — where MLX cannot run at all — from offering the tool).
      # Deliberately linked for the Simulator too, even though it can never run
      # there: that is the only way the Simulator slice keeps COMPILING this code,
      # and no CI job builds iOS at all.
      # Must stay OUTSIDE the RAYMOL_SPARKLE_BEGIN/END markers or
      # archive_appstore.sh strips it.
      - package: BoltzMLX
        product: BoltzMLX
      # protenix-mlx: the second inference runtime (#309). Same macOS-only filter and
      # the same reasoning as BoltzMLX above, and likewise outside the Sparkle markers
      # so archive_appstore.sh does not strip prediction out of the MAS build.
      - package: ProtenixMLX
        product: ProtenixMLX
        platforms: [macOS]
# RAYMOL_SPARKLE_BEGIN — stripped for the Mac App Store build (see archive_appstore.sh)
      # macOS-only: Sparkle has no iOS slice, so the platforms filter keeps it
      # out of the iOS build. All Swift usage is additionally guarded by
      # #if os(macOS) && !RAYMOL_MAS_RESTRICTED.
      - package: Sparkle
        platforms: [macOS]
# RAYMOL_SPARKLE_END
    scheme:
      testTargets:
        - PyMOLViewerTests
        - PyMOLViewerUITests
      gatherCoverageData: false

  # macOS unit-test target: hosts Design-mode Swift logic tests with @testable import.
  # Runs in-process inside the macOS app (TEST_HOST + BUNDLE_LOADER) so the full
  # RayMol Swift module is visible to @testable import without linking pymol_core again.
  PyMOLViewerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PyMOLViewerTests
    dependencies:
      - target: PyMOLViewer_macOS
        link: false
      # MPNNKit: required so DesignResiduesTests (which does `import MPNNKit` inside
      # #if RAYMOL_MPNN) and DesignResidues.swift both compile. The test target is
      # macOS-only by its own `platform: macOS`, so no platformFilter is needed here.
      # The test bundle runs in-process inside RayMol.app (BUNDLE_LOADER), which
      # already links MPNNKit; this dep adds the Swift module to the test target's
      # compile search path.
      - package: proteinmpnn-mlx
        product: MPNNKit
      # BoltzMLX: required so BoltzJobManager.swift (which does `import BoltzMLX`)
      # is visible to @testable import RayMol. The test target is macOS-only by its
      # own `platform: macOS`, so no platformFilter is needed.
      - package: BoltzMLX
        product: BoltzMLX
      # ProtenixMLX: same, for ProtenixJobManager.swift.
      - package: ProtenixMLX
        product: ProtenixMLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.raymol.RayMol.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RayMol.app/Contents/MacOS/RayMol"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Blank out the app-level C++ bridge — the test bundle is pure Swift and
        # must not inherit the bridging header or linker flags that pull in pymol_core.
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        OTHER_CPLUSPLUSFLAGS: ""
        # Enable the RAYMOL_MPNN compilation condition so DesignResidues.swift and
        # DesignResiduesTests.swift compile their #if RAYMOL_MPNN blocks. Mirrors the
        # app target's [sdk=macosx*] setting; the test target is macOS-only so no
        # conditional key is needed.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS": "$(inherited) RAYMOL_MPNN"

  # iOS UI-test target: real-touch gesture coverage (rotate/zoom/Z-roll/tap)
  # through the genuine UIKit recognizer path, verified by pixel-diffing the
  # Metal-rendered viewport. iOS-only; does not affect the macOS app.
  PyMOLViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PyMOLViewerUITests
    dependencies:
      - target: PyMOLViewer_iOS
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.raymol.RayMol.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PyMOLViewer_iOS
        TARGETED_DEVICE_FAMILY: "1,2"
        # The project xcconfig + base settings link pymol_core + Python and set
        # a C++ bridging header for the APP. A pure-Swift UI-test bundle must
        # inherit NONE of that (else it dlopens @rpath/Python.framework and
        # fails to load). Blank them out at the target level (highest priority).
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        OTHER_CPLUSPLUSFLAGS: ""
