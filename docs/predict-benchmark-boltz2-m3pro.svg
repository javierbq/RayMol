<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Boltz-2 inference time and MLX peak memory versus sequence length, 60 to 900 residues, on an Apple M3 Pro. Time rises from 6.5 seconds at 60 residues to 2540 seconds at 900. Peak memory rises from 0.78 GB to 32.71 GB.">
<style>
  .s{fill:#fcfcfb}.tp{fill:#0b0b0b}.ts{fill:#52514e}.tm{fill:#898781}
  .grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}
  .l1{stroke:#2a78d6}.d1{fill:#2a78d6}.l2{stroke:#eb6834}.d2{fill:#eb6834}
  .ring{stroke:#fcfcfb;stroke-width:2}.ref{stroke:#898781;stroke-width:1;stroke-dasharray:4 3}
  @media (prefers-color-scheme: dark){
    .s{fill:#1a1a19}.tp{fill:#ffffff}.ts{fill:#c3c2b7}
    .grid{stroke:#2c2c2a}.axis{stroke:#383835}
    .l1{stroke:#3987e5}.d1{fill:#3987e5}.l2{stroke:#d95926}.d2{fill:#d95926}
    .ring{stroke:#1a1a19}}
</style>
